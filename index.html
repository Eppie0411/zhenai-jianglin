<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>真爱降临</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/modules.css" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/home">
    <svg class="brand-cat" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M11 16.5 8.6 8.6c-.2-.7.3-1.3 1-1.1l7 2.4M29 16.5l2.4-7.9c.2-.7-.3-1.3-1-1.1l-7 2.4" />
      <path d="M20 9.6c6.3 0 10.6 4.6 10.6 10.9S26.3 31 20 31 9.4 26.8 9.4 20.5 13.7 9.6 20 9.6Z" />
      <circle cx="16.2" cy="19.4" r=".95" fill="currentColor" stroke="none" />
      <circle cx="23.8" cy="19.4" r=".95" fill="currentColor" stroke="none" />
      <path d="M18.4 23.2c.5.6 1 .9 1.6.9s1.1-.3 1.6-.9" />
      <path d="M20 21.4v1.1" />
    </svg>
    <span class="brand-name" id="brandName">真爱降临</span>
  </a>
  <nav class="tabs" id="tabs">
    <a href="#/home" data-tab="home">主页</a>
    <a href="#/cards" data-tab="cards">字卡传讯</a>
    <a href="#/ledger" data-tab="ledger">记账</a>
    <a href="#/diary" data-tab="diary">日记</a>
    <a href="#/gamelog" data-tab="gamelog">游戏日常</a>
    <a href="#/ifline" data-tab="ifline">if 线</a>
    <a href="#/showcase" data-tab="showcase">稿件</a>
    <a href="#/games" data-tab="games">小游戏</a>
  </nav>
  <button class="icon-btn theme-btn" id="themeBtn" title="换个配色">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.4"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"/></svg>
  </button>
</header>

<main id="view" class="view"></main>

<!-- 音乐小光盘 -->
<div class="player" id="player">
  <div class="player-panel" id="playerPanel">
    <div class="pp-row">
      <div class="pp-title" id="ppTitle">默认 · 夜灯</div>
      <div class="pp-sub" id="ppSub">程序生成的纯音乐</div>
    </div>
    <div class="pp-controls">
      <button class="mini-btn" id="ppPrev" title="上一个">‹</button>
      <button class="mini-btn big" id="ppPlay" title="播放 / 暂停">
        <svg viewBox="0 0 24 24" id="ppPlayIcon"><path d="M8 5.4v13.2L19 12 8 5.4Z"/></svg>
      </button>
      <button class="mini-btn" id="ppNext" title="下一个">›</button>
    </div>
    <label class="pp-vol">
      <span>音量</span>
      <input type="range" id="ppVol" min="0" max="100" value="55" />
    </label>
    <label class="pp-import">
      导入本地音频
      <input type="file" id="ppFile" accept="audio/*" multiple hidden />
    </label>
    <div class="pp-list" id="ppList"></div>
  </div>
  <button class="disc" id="disc" title="播放 / 暂停音乐">
    <span class="disc-inner"></span>
    <span class="disc-hole"></span>
  </button>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/cards.js"></script>
<script src="js/ledger.js"></script>
<script src="js/diary.js"></script>
<script src="js/gamelog.js"></script>
<script src="js/ifline.js"></script>
<script src="js/showcase.js"></script>
<script src="js/games.js"></script>
<script src="js/music.js"></script>
</body>
</html>
